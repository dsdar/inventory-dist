# Copied to inventory-dist by image-release.yml; edit it in the Inventory repository.
# Builds the card images from the kit that release pushed here, attaches them to a
# Release on this public repository (they're too big for Pages), and adds them to
# os-list.json, the list Raspberry Pi Imager reads.
name: build-image

on:
  push:
    branches: [main]
    paths: ["image/request.json"]

permissions:
  contents: write
  pages: write

concurrency:
  group: build-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Read the request and unpack the kit
        run: |
          version="$(python3 -c 'import json; print(json.load(open("image/request.json"))["version"])')"
          models="$(python3 -c 'import json; print(" ".join(json.load(open("image/request.json"))["models"]))')"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "MODELS=$models" >> "$GITHUB_ENV"
          mkdir "$RUNNER_TEMP/kit"
          tar -xzf "image/$version/kit.tar.gz" -C "$RUNNER_TEMP/kit"

      - name: Build
        run: |
          for model in $MODELS; do
            sudo bash "$RUNNER_TEMP/kit/image/build.sh" --model "$model" --version "$VERSION" --out "$RUNNER_TEMP/out"
          done

      - name: Publish the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$VERSION" in *-*) flags="--prerelease" ;; esac
          gh release create "image-v$VERSION" "$RUNNER_TEMP"/out/*.img.xz $flags --target main --latest=false \
            --title "Home Inventory image $VERSION" \
            --notes "Card images. Write them with Raspberry Pi Imager."

      - name: Update the Imager list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          for info in "$RUNNER_TEMP"/out/*.json; do
            python3 "$RUNNER_TEMP/kit/image/make_oslist.py" --list os-list.json --info "$info" \
              --url "https://github.com/$GITHUB_REPOSITORY/releases/download/image-v$VERSION"
          done
          git add os-list.json
          git commit -m "Publish image $VERSION"
          git push
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" || true
